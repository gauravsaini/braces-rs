name: CI

env:
  DEBUG: napi:*
  APP_NAME: braces-rs
  MACOSX_DEPLOYMENT_TARGET: '10.13'

permissions:
  contents: write
  id-token: write

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request: null

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            arch: x64
            build: pnpm exec napi build --platform --release --target x86_64-apple-darwin --cargo-cwd ../crates/braces-napi --js binding.js --dts binding.d.ts
          - host: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            build: pnpm exec napi build --platform --release --target aarch64-apple-darwin --cargo-cwd ../crates/braces-napi --js binding.js --dts binding.d.ts
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            build: pnpm exec napi build --platform --release --target x86_64-pc-windows-msvc --cargo-cwd ../crates/braces-napi --js binding.js --dts binding.d.ts
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64
            build: pnpm exec napi build --platform --release --target x86_64-unknown-linux-gnu --cargo-cwd ../crates/braces-napi --js binding.js --dts binding.d.ts
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: arm64
            cross_aarch64: true
            build: pnpm exec napi build --platform --release --target aarch64-unknown-linux-gnu --cargo-cwd ../crates/braces-napi --js binding.js --dts binding.d.ts
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch: x64
            setup_zig: true
            build: pnpm exec napi build --platform --release --target x86_64-unknown-linux-musl --cargo-cwd ../crates/braces-napi --js binding.js --dts binding.d.ts --zig

    name: build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.settings.arch }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.settings.target }}

      - name: Install aarch64 cross compiler
        if: ${{ matrix.settings.cross_aarch64 }}
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl-tools
        if: contains(matrix.settings.target, 'musl') && matrix.settings.host == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: goto-bus-stop/setup-zig@v2
        if: ${{ matrix.settings.setup_zig }}
        with:
          version: 0.13.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}

      - name: Install dependencies
        run: |
          pnpm install
          cd napi && pnpm install

      - name: Build
        run: |
          cd napi
          ${{ matrix.settings.build }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: napi/*.node
          if-no-files-found: error

  test:
    name: test - ${{ matrix.settings.target }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.settings.arch }}

      - name: Install dependencies
        run: |
          pnpm install
          cd napi && pnpm install

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: napi

      - name: Run tests
        run: |
          cd napi
          pnpm test
        shell: bash

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs:
      - test
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: |
          pnpm install
          cd napi && pnpm install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: artifacts
          merge-multiple: true

      - name: Copy binaries to napi directory
        run: |
          cp artifacts/*.node napi/
          ls -la napi/*.node
        shell: bash

      - name: Pack dry-run check
        run: |
          cd napi
          npm pack --dry-run
        shell: bash

      - name: Publish package
        run: |
          cd napi
          npm config set provenance true
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
