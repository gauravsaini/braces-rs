name: CI

env:
  DEBUG: napi:*
  APP_NAME: braces-rs
  MACOSX_DEPLOYMENT_TARGET: '10.13'

permissions:
  contents: write
  id-token: write

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request: null

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            arch: x64
            build: pnpm build --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
            build: pnpm build --target aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            build: pnpm build --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            arch: x64
            build: pnpm build --target aarch64-pc-windows-msvc
          # Linux builds disabled due to CI runner availability issues
          # - host: ubuntu-20.04
          #   target: x86_64-unknown-linux-gnu
          #   arch: x64
          #   build: pnpm build --target x86_64-unknown-linux-gnu
          # - host: ubuntu-20.04
          #   target: aarch64-unknown-linux-gnu
          #   arch: x64
          #   build: pnpm build --target aarch64-unknown-linux-gnu --use-napi-cross
          # - host: ubuntu-20.04
          #   target: x86_64-unknown-linux-musl
          #   arch: x64
          #   setup_zig: true
          #   build: pnpm build --target x86_64-unknown-linux-musl --zig
          # - host: ubuntu-20.04
          #   target: aarch64-unknown-linux-musl
          #   arch: x64
          #   setup_zig: true
          #   build: pnpm build --target aarch64-unknown-linux-musl --zig

    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.settings.arch }}

      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.settings.target }}

      - uses: goto-bus-stop/setup-zig@v2
        if: ${{ matrix.settings.setup_zig }}
        with:
          version: 0.13.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}

      - name: Install dependencies
        run: |
          pnpm install
          cd napi && pnpm install

      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: napi/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
        node:
          - '22'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.settings.arch }}

      - name: Install dependencies
        run: |
          pnpm install
          cd napi && pnpm install

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: napi

      - name: List packages
        run: ls -R napi
        shell: bash

      - name: Test bindings
        run: pnpm test

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - test-macOS-windows-binding
    if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: |
          pnpm install
          cd napi && pnpm install

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: artifacts
          merge-multiple: true

      - name: Copy binaries to napi directory
        run: |
          cp artifacts/*.node napi/
          ls -la napi/*.node
        shell: bash

      - name: Pack dry-run check
        run: |
          cd napi
          npm pack --dry-run
        shell: bash

      - name: Publish
        run: |
          cd napi
          npm config set provenance true
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
