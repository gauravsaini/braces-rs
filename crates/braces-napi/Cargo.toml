[package]
name = "braces-napi"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "napi-rs Node.js binding for braces-core (drop-in for micromatch/braces)"
license = "MIT"

[lib]
crate-type = ["cdylib"]
name = "braces_napi"

[dependencies]
braces-core = { path = "../braces-core" }
napi = { version = "2.12", features = ["napi4", "serde-json"] }
napi-derive = "2.12"
mimalloc-safe = { version = "0.1", features = ["skip_collect_on_exit"] }

# LEARNINGS.md #7: local_dynamic_tls on Linux x64/arm64, no_opt_arch on arm64.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
mimalloc-safe = { version = "0.1", features = ["local_dynamic_tls"] }
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
mimalloc-safe = { version = "0.1", features = ["local_dynamic_tls", "no_opt_arch"] }

[build-dependencies]
napi-build = "2.0"
